<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RingScript — Ring in the browser</title>
<link rel="icon" href="../favicon.ico">
<style>
    :root {
        --bg: #f6f7f9;
        --panel: #ffffff;
        --ink: #24292f;
        --muted: #6a737d;
        --accent: #1a7f5a;
        --error: #b42318;
        --border: #d8dee4;
        --mono: "Cascadia Code", Consolas, "Courier New", monospace;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #14171a;
            --panel: #1c2126;
            --ink: #d9dee3;
            --muted: #8b949e;
            --accent: #3fb984;
            --error: #ef6a5a;
            --border: #30363d;
        }
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 2rem 1.5rem;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.6 system-ui, "Segoe UI", sans-serif;
        max-width: 60rem;
        margin-inline: auto;
    }
    h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
    h1 small { color: var(--muted); font-weight: normal; font-size: .95rem; }
    p.tagline { color: var(--muted); margin: 0 0 1.5rem; }
    .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1rem;
    }
    textarea {
        width: 100%;
        min-height: 9rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.5 var(--mono);
        padding: .75rem;
        resize: vertical;
    }
    .row { display: flex; gap: .75rem; align-items: center; margin-top: .75rem; flex-wrap: wrap; }
    button {
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        border-radius: 6px;
        padding: .5rem 1.25rem;
        font-size: .95rem;
        cursor: pointer;
    }
    button.secondary {
        background: transparent;
        color: var(--accent);
    }
    button:disabled { opacity: .5; cursor: default; }
    #status { color: var(--muted); font-size: .9rem; }
    pre {
        margin: 0;
        padding: .75rem;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        font: 14px/1.5 var(--mono);
        white-space: pre-wrap;
        word-break: break-word;
        min-height: 3rem;
        max-height: 24rem;
        overflow-y: auto;
    }
    .label { font-size: .85rem; color: var(--muted); margin: 0 0 .35rem; }
    #errbox { color: var(--error); }
</style>
</head>
<body>
<h1>RingScript <small>— the Ring VM, resident in your browser</small></h1>
<p class="tagline">Zig-built wasm32-wasi module &middot; state persists across evals</p>

<div class="panel">
    <p class="label">Ring code</p>
    <textarea id="code" spellcheck="false">see 1+2</textarea>
    <div class="row">
        <button id="run" disabled>Run (Ctrl+Enter)</button>
        <button id="reset" class="secondary" disabled>Reset VM</button>
        <span id="status">loading wasm&hellip;</span>
    </div>
</div>

<div class="panel">
    <p class="label">Output</p>
    <pre id="out"></pre>
</div>

<div class="panel">
    <p class="label">Errors / VM messages</p>
    <pre id="errbox"></pre>
</div>

<script src="ringscript.js"></script>
<script>
(async function () {
    const $ = id => document.getElementById(id);
    let vmMessages = "";
    let ring;
    try {
        ring = await RingScript.load("ringscript.wasm", {
            onOutput: text => { vmMessages += text; $("errbox").textContent = vmMessages; },
        });
        $("status").textContent = "ready — resident RingState initialized";
        $("run").disabled = false;
        $("reset").disabled = false;
    } catch (e) {
        $("status").textContent = "failed to load: " + e.message;
        throw e;
    }

    function run() {
        vmMessages = "";
        $("errbox").textContent = "";
        const t0 = performance.now();
        const r = ring.eval($("code").value);
        const ms = (performance.now() - t0).toFixed(1);
        $("out").textContent = r.output;
        if (r.error) $("errbox").textContent = r.error + "\n" + vmMessages;
        $("status").textContent = (r.ok ? "ok" : "error " + r.code) + " — " + ms + " ms";
    }

    $("run").addEventListener("click", run);
    $("code").addEventListener("keydown", e => {
        if (e.ctrlKey && e.key === "Enter") { e.preventDefault(); run(); }
    });
    $("reset").addEventListener("click", () => {
        ring.reset();
        $("out").textContent = "";
        $("errbox").textContent = "";
        $("status").textContent = "VM reset — fresh RingState";
    });
})();
</script>
</body>
</html>
