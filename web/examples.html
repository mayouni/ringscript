<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RingScript Playground — 24 Ring examples, editable</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="site.css">
<style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 system-ui, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* ---------------------------------------------------------- toolbar */
    header {
        display: flex;
        align-items: center;
        gap: .75rem;
        padding: .5rem .75rem;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
        flex-wrap: wrap;
    }
    header .brand { font-weight: 700; white-space: nowrap; }
    header .brand small { color: var(--muted); font-weight: 400; }
    select {
        flex: 1 1 14rem;
        min-width: 10rem;
        max-width: 26rem;
        padding: .4rem .5rem;
        font-size: .95rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--ink);
    }
    button {
        border: 1px solid var(--accent);
        background: var(--accent);
        color: var(--accent-ink);
        border-radius: 6px;
        padding: .4rem 1.2rem;
        font-size: .95rem;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
    }
    button.secondary {
        background: transparent;
        color: var(--accent);
        font-weight: 400;
    }
    button:disabled { opacity: .5; cursor: default; }
    #status { color: var(--muted); font-size: .85rem; margin-left: auto; white-space: nowrap; }

    /* ------------------------------------------------------------ split */
    main {
        flex: 1 1 auto;
        display: flex;
        min-height: 0;
    }
    #editor-pane {
        flex: 0 0 66%;
        min-width: 12rem;
        display: flex;
        min-height: 0;
        background: var(--panel);
        position: relative;
    }
    #splitter {
        flex: 0 0 6px;
        cursor: col-resize;
        background: var(--border);
        transition: background .15s;
    }
    #splitter:hover, #splitter.active { background: var(--accent); }
    #right-pane {
        flex: 1 1 0;
        min-width: 10rem;
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--bg);
    }

    /* ----------------------------------------------------------- editor */
    #gutter {
        flex: 0 0 auto;
        padding: .6rem 0;
        background: var(--gutter-bg);
        border-right: 1px solid var(--border);
        color: var(--muted);
        font: 14px/1.5 var(--mono);
        text-align: right;
        user-select: none;
        overflow: hidden;
        white-space: pre;
    }
    #gutter div { padding: 0 .6rem 0 .9rem; }
    #gutter div.cur { color: var(--accent); font-weight: 700; background: var(--line-hl); }
    #editor-wrap {
        position: relative;
        flex: 1 1 auto;
        overflow: hidden;
    }
    #highlight, #code {
        margin: 0;
        border: 0;
        padding: .6rem .75rem;
        font: 14px/1.5 var(--mono);
        white-space: pre;
        overflow-wrap: normal;
        tab-size: 4;
    }
    #highlight {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        color: var(--ink);
    }
    #line-hl {
        position: absolute;
        left: 0;
        right: 0;
        height: calc(14px * 1.5);
        background: var(--line-hl);
        pointer-events: none;
    }
    #code {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        resize: none;
        background: transparent;
        color: transparent;
        caret-color: var(--ink);
        outline: none;
        overflow: auto;
    }
    #code::selection { background: var(--sel); color: transparent; }
    .tok-kw { color: var(--tok-kw); font-weight: 600; }
    .tok-str { color: var(--tok-str); }
    .tok-num { color: var(--tok-num); }
    .tok-com { color: var(--tok-com); font-style: italic; }
    .tok-atom { color: var(--tok-atom); }
    .tok-fn { color: var(--tok-fn); }

    /* ------------------------------------------------------ right pane */
    #out-box {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        margin: .6rem .6rem .3rem .6rem;
        padding: .6rem .7rem;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        font: 13.5px/1.5 var(--mono);
        white-space: pre-wrap;
        word-break: break-word;
    }
    #out-box .err { color: var(--error); font-weight: 600; }
    #bottom-box {
        flex: 0 0 auto;
        padding: .3rem .6rem .6rem .6rem;
        display: flex;
        flex-direction: column;
        gap: .4rem;
    }
    #bottom-box .label { font-size: .8rem; color: var(--muted); }
    #input {
        width: 100%;
        min-height: 3.2rem;
        max-height: 9rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        color: var(--ink);
        font: 13.5px/1.5 var(--mono);
        padding: .45rem .6rem;
        resize: vertical;
    }
    #bottom-box .row { display: flex; gap: .5rem; }

    /* ------------------------------------------------------- responsive */
    @media (max-width: 720px) {
        main { flex-direction: column; }
        #editor-pane { flex: 1 1 55%; }
        #splitter { display: none; }
        #right-pane { flex: 1 1 45%; border-top: 1px solid var(--border); }
        header .brand small { display: none; }
    }
</style>
</head>
<body>

<nav class="site">
    <a class="logo" href="index.html">Ring<span>Script</span></a>
    <a href="index.html">Home</a>
    <a class="active" href="examples.html">Playground</a>
    <a href="repl.html">REPL</a>
    <a href="tutorial.html">Tutorial</a>
</nav>
<header>
    <select id="picker" title="Example"></select>
    <button id="run" disabled>&#9654; Run</button>
    <span id="status">loading wasm&hellip;</span>
</header>

<main>
    <section id="editor-pane">
        <div id="gutter"></div>
        <div id="editor-wrap">
            <div id="line-hl"></div>
            <pre id="highlight"></pre>
            <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"></textarea>
        </div>
    </section>
    <div id="splitter" title="Drag to resize"></div>
    <section id="right-pane">
        <div id="out-box"></div>
        <div id="bottom-box">
            <span class="label">Input — one line per <code>give</code></span>
            <textarea id="input" spellcheck="false"></textarea>
            <div class="row">
                <button id="reset" class="secondary" title="Restore the example's original code and input">Reset example</button>
            </div>
        </div>
    </section>
</main>

<script src="examples-data.js"></script>
<script src="ringscript.js"></script>
<script>
(function () {
    "use strict";
    const $ = id => document.getElementById(id);
    const codeEl = $("code"), hlEl = $("highlight"), gutterEl = $("gutter"), lineHlEl = $("line-hl");

    // ------------------------------------------------- Ring highlighter
    const KEYWORDS = new Set(("see give put get but ok if else elseif for to next while end do again " +
        "return func def function endfunction endfunc class endclass endpackage from new try catch done " +
        "switch on other off exit loop step in load import private package bracestart braceend " +
        "braceexpreval braceerror bracenewline changeringkeyword changeringoperator and or not " +
        "true false nl null main init self this super raise").split(" "));

    function escapeHtml(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function highlightRing(src) {
        let out = "", i = 0;
        const n = src.length;
        const isIdStart = c => /[A-Za-z_\u00A0-\uFFFF]/.test(c);
        const isId = c => /[A-Za-z0-9_\u00A0-\uFFFF]/.test(c);
        while (i < n) {
            const c = src[i];
            // comments
            if (c === "#" || (c === "/" && src[i + 1] === "/")) {
                let j = i;
                while (j < n && src[j] !== "\n") j++;
                out += '<span class="tok-com">' + escapeHtml(src.slice(i, j)) + "</span>";
                i = j;
                continue;
            }
            if (c === "/" && src[i + 1] === "*") {
                let j = i + 2;
                while (j < n && !(src[j] === "*" && src[j + 1] === "/")) j++;
                j = Math.min(n, j + 2);
                out += '<span class="tok-com">' + escapeHtml(src.slice(i, j)) + "</span>";
                i = j;
                continue;
            }
            // strings (Ring has no escape sequences)
            if (c === '"' || c === "'" || c === "`") {
                let j = i + 1;
                while (j < n && src[j] !== c) j++;
                j = Math.min(n, j + 1);
                out += '<span class="tok-str">' + escapeHtml(src.slice(i, j)) + "</span>";
                i = j;
                continue;
            }
            // :atoms
            if (c === ":" && i + 1 < n && isIdStart(src[i + 1])) {
                let j = i + 1;
                while (j < n && isId(src[j])) j++;
                out += '<span class="tok-atom">' + escapeHtml(src.slice(i, j)) + "</span>";
                i = j;
                continue;
            }
            // numbers
            if (/[0-9]/.test(c)) {
                let j = i;
                while (j < n && /[0-9._eE+\-xXa-fA-F]/.test(src[j])) {
                    if ((src[j] === "+" || src[j] === "-") && !/[eE]/.test(src[j - 1])) break;
                    j++;
                }
                out += '<span class="tok-num">' + escapeHtml(src.slice(i, j)) + "</span>";
                i = j;
                continue;
            }
            // identifiers / keywords
            if (isIdStart(c)) {
                let j = i;
                while (j < n && isId(src[j])) j++;
                const word = src.slice(i, j);
                let k = j;
                while (k < n && (src[k] === " " || src[k] === "\t")) k++;
                if (KEYWORDS.has(word.toLowerCase())) {
                    out += '<span class="tok-kw">' + escapeHtml(word) + "</span>";
                } else if (src[k] === "(") {
                    out += '<span class="tok-fn">' + escapeHtml(word) + "</span>";
                } else {
                    out += escapeHtml(word);
                }
                i = j;
                continue;
            }
            out += escapeHtml(c);
            i++;
        }
        return out;
    }

    // ------------------------------------------------------ editor sync
    let lineCount = 0;
    function refresh() {
        const src = codeEl.value;
        hlEl.innerHTML = highlightRing(src) + "\n";
        const lines = src.split("\n").length;
        if (lines !== lineCount) {
            lineCount = lines;
            let g = "";
            for (let i = 1; i <= lines; i++) g += "<div>" + i + "</div>";
            gutterEl.innerHTML = g;
        }
        updateCurrentLine();
        syncScrollSimple();
    }

    let curLine = -1;
    function updateCurrentLine() {
        const line = codeEl.value.slice(0, codeEl.selectionStart).split("\n").length;
        const kids = gutterEl.children;
        if (curLine !== line) {
            if (curLine >= 1 && curLine <= kids.length) kids[curLine - 1].classList.remove("cur");
            if (line >= 1 && line <= kids.length) kids[line - 1].classList.add("cur");
            curLine = line;
        }
        const lh = parseFloat(getComputedStyle(hlEl).lineHeight);
        const padTop = parseFloat(getComputedStyle(hlEl).paddingTop);
        lineHlEl.style.height = lh + "px";
        lineHlEl.style.top = (padTop + (line - 1) * lh - codeEl.scrollTop) + "px";
    }

    codeEl.addEventListener("input", refresh);
    codeEl.addEventListener("scroll", () => { syncScrollSimple(); updateCurrentLine(); });
    codeEl.addEventListener("keyup", updateCurrentLine);
    codeEl.addEventListener("click", updateCurrentLine);
    document.addEventListener("selectionchange", () => {
        if (document.activeElement === codeEl) updateCurrentLine();
    });

    function syncScrollSimple() {
        hlEl.scrollTop = codeEl.scrollTop;
        hlEl.scrollLeft = codeEl.scrollLeft;
        gutterEl.scrollTop = codeEl.scrollTop;
    }

    // Tab inserts 4 spaces (indents the selection if it spans lines)
    codeEl.addEventListener("keydown", e => {
        if (e.key !== "Tab") return;
        e.preventDefault();
        const start = codeEl.selectionStart, end = codeEl.selectionEnd;
        const v = codeEl.value;
        if (start !== end && v.slice(start, end).includes("\n")) {
            const ls = v.lastIndexOf("\n", start - 1) + 1;
            const block = v.slice(ls, end);
            let repl, delta;
            if (e.shiftKey) {
                repl = block.replace(/^ {1,4}/gm, "");
                delta = 0;
            } else {
                repl = block.replace(/^/gm, "    ");
                delta = 4;
            }
            codeEl.value = v.slice(0, ls) + repl + v.slice(end);
            codeEl.selectionStart = start + (e.shiftKey ? 0 : delta);
            codeEl.selectionEnd = ls + repl.length;
        } else if (!e.shiftKey) {
            codeEl.setRangeText("    ", start, end, "end");
        }
        refresh();
    });

    // ----------------------------------------------------------- output
    const outBox = $("out-box");
    function showOutput(text, errText) {
        outBox.textContent = "";
        if (text) outBox.appendChild(document.createTextNode(text));
        if (errText) {
            const s = document.createElement("span");
            s.className = "err";
            s.textContent = (text && !text.endsWith("\n") ? "\n" : "") + errText;
            outBox.appendChild(s);
        }
        outBox.scrollTop = outBox.scrollHeight;
    }

    // --------------------------------------------------------- splitter
    const editorPane = $("editor-pane"), splitter = $("splitter"), mainEl = document.querySelector("main");
    const savedRatio = parseFloat(localStorage.getItem("rs-split") || "");
    if (savedRatio >= 25 && savedRatio <= 85) editorPane.style.flexBasis = savedRatio + "%";
    let dragging = false;
    splitter.addEventListener("pointerdown", e => {
        dragging = true;
        splitter.classList.add("active");
        splitter.setPointerCapture(e.pointerId);
        e.preventDefault();
    });
    splitter.addEventListener("pointermove", e => {
        if (!dragging) return;
        const rect = mainEl.getBoundingClientRect();
        let pct = ((e.clientX - rect.left) / rect.width) * 100;
        pct = Math.max(25, Math.min(85, pct));
        editorPane.style.flexBasis = pct + "%";
    });
    splitter.addEventListener("pointerup", e => {
        dragging = false;
        splitter.classList.remove("active");
        splitter.releasePointerCapture(e.pointerId);
        const pct = parseFloat(editorPane.style.flexBasis);
        if (pct) localStorage.setItem("rs-split", pct.toFixed(1));
    });

    // ------------------------------------------------------ examples/run
    const picker = $("picker");
    for (const ex of RING_EXAMPLES) {
        const opt = document.createElement("option");
        opt.value = ex.id;
        opt.textContent = ex.title;
        picker.appendChild(opt);
    }

    function currentExample() {
        return RING_EXAMPLES.find(e => e.id === picker.value) || RING_EXAMPLES[0];
    }
    function loadExample() {
        const ex = currentExample();
        codeEl.value = ex.code;
        $("input").value = ex.input;
        showOutput("", "");
        $("status").textContent = "ready";
        codeEl.scrollTop = 0;
        codeEl.selectionStart = codeEl.selectionEnd = 0;
        refresh();
    }
    picker.addEventListener("change", loadExample);
    $("reset").addEventListener("click", () => { loadExample(); codeEl.focus(); });

    let wasmBytes = null, running = false;
    async function run() {
        if (running || !wasmBytes) return;
        running = true;
        $("run").disabled = true;
        $("status").textContent = "running…";
        try {
            // fresh VM per run — examples like ChangeRingKeyword rewire the scanner
            const ring = await RingScript.load(wasmBytes.slice(0), { captureStdout: true, onOutput: () => {} });
            const t0 = performance.now();
            const r = ring.eval(codeEl.value, $("input").value);
            const ms = (performance.now() - t0).toFixed(1);
            showOutput(r.output, r.error);
            $("status").textContent = (r.ok ? "ok" : "error") + " — " + ms + " ms";
        } catch (e) {
            showOutput("", "runtime crashed: " + e.message);
            $("status").textContent = "crashed";
        } finally {
            running = false;
            $("run").disabled = false;
        }
    }
    $("run").addEventListener("click", run);
    document.addEventListener("keydown", e => {
        if (e.ctrlKey && e.key === "Enter") { e.preventDefault(); run(); }
    });

    (async () => {
        try {
            const resp = await fetch("ringscript.wasm");
            wasmBytes = await resp.arrayBuffer();
            $("run").disabled = false;
            $("status").textContent = "ready";
        } catch (e) {
            $("status").textContent = "failed to load wasm: " + e.message;
        }
    })();

    loadExample();
})();
</script>
</body>
</html>
